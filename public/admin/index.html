<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — GlyphCraft Icons</title>
<link rel="stylesheet" href="/cdn/glyphcraft.css">
<style>
  :root {
    --bg: #0b0e14; --panel: #11151f; --border: #232838;
    --text: #e6e9f0; --muted: #8a91a3; --accent: #6d5efc; --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 30px 20px; }
  h1 { font-size: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; margin-top: 14px; }
  input[type="email"], input[type="password"], input[type="text"], textarea, select {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: #0e1219; color: var(--text); font-size: 14px; font-family: inherit;
  }
  textarea { min-height: 100px; font-family: monospace; font-size: 12px; }
  button {
    margin-top: 16px; padding: 10px 18px; border-radius: 8px; border: none;
    background: var(--accent); color: white; font-size: 14px; cursor: pointer; font-weight: 600;
  }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.danger { background: var(--danger); }
  .msg { margin-top: 12px; font-size: 13px; padding: 10px; border-radius: 8px; display: none; }
  .msg.error { background: rgba(239,68,68,0.12); color: #f87171; display: block; }
  .msg.success { background: rgba(34,197,94,0.12); color: #4ade80; display: block; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .icon-preview { font-size: 22px; }
  .del-btn { background: transparent; border: none; color: var(--danger); cursor: pointer; font-size: 13px; margin: 0; padding: 4px 8px; }
  #dashboard { display: none; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>
<div class="wrap">

  <div id="loginView" class="card">
    <h1>🔒 Admin Login</h1>
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="Enter your email">
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="Enter your password">
    <button onclick="login()">Access Admin Dashboard</button>
    <div id="loginMsg" class="msg"></div>
  </div>

  <div id="dashboard">
    <div class="top-bar">
      <h1>Icon Manager</h1>
      <button class="secondary" onclick="logout()">Log out</button>
    </div>

    <div class="card">
      <h1 style="font-size:16px;">Upload New Icon</h1>
      <div class="row">
        <div>
          <label>Icon Name (unique)</label>
          <input type="text" id="newName" placeholder="e.g. home, user, sparkles">
        </div>
        <div>
          <label>Category</label>
          <select id="newCategory">
            <option value="colorful">Colorful</option>
            <option value="mono">Outline / Mono</option>
          </select>
        </div>
      </div>
      <label>SVG Code</label>
      <textarea id="newSvg" placeholder="Paste full <svg>...</svg> code here"></textarea>
      <div class="hint">Duplicate names are automatically rejected.</div>
      <button onclick="uploadIcon()">Upload Icon</button>
      <div id="uploadMsg" class="msg"></div>
    </div>

    <div class="card">
      <h1 style="font-size:16px;">Existing Icons</h1>
      <div id="listMsg" class="msg"></div>
      <table>
        <thead><tr><th></th><th>Name</th><th>Category</th><th></th></tr></thead>
        <tbody id="iconTableBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="/cdn/icons.js" defer></script>
<script>
  const TOKEN_KEY = 'glyphcraft_admin_token';

  function getToken() { return localStorage.getItem(TOKEN_KEY); }
  function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
  function clearToken() { localStorage.removeItem(TOKEN_KEY); }

  function showView() {
    const token = getToken();
    document.getElementById('loginView').style.display = token ? 'none' : 'block';
    document.getElementById('dashboard').style.display = token ? 'block' : 'none';
    if (token) loadIcons();
  }

  async function login() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const msg = document.getElementById('loginMsg');
    msg.className = 'msg';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');
      setToken(data.token);
      showView();
    } catch (e) {
      msg.className = 'msg error';
      msg.textContent = e.message;
    }
  }

  function logout() {
    clearToken();
    showView();
  }

  async function uploadIcon() {
    const name = document.getElementById('newName').value.trim();
    const category = document.getElementById('newCategory').value;
    const svg_code = document.getElementById('newSvg').value.trim();
    const msg = document.getElementById('uploadMsg');
    msg.className = 'msg';

    if (!name || !svg_code) {
      msg.className = 'msg error';
      msg.textContent = 'Name and SVG code are required.';
      return;
    }

    try {
      const res = await fetch('/api/icons', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + getToken(),
        },
        body: JSON.stringify({ name, category, svg_code }),
      });
      const data = await res.json();
      if (data.errors && data.errors.length) {
        throw new Error(data.errors[0].error);
      }
      if (!res.ok) throw new Error(data.error || 'Upload failed');

      msg.className = 'msg success';
      msg.textContent = 'Icon uploaded successfully.';
      document.getElementById('newName').value = '';
      document.getElementById('newSvg').value = '';
      loadIcons();
      if (window.GlyphCraft) window.GlyphCraft.reload();
    } catch (e) {
      msg.className = 'msg error';
      msg.textContent = e.message;
    }
  }

  async function deleteIcon(name) {
    if (!confirm('Delete icon "' + name + '"? This cannot be undone.')) return;
    try {
      const res = await fetch('/api/icons?name=' + encodeURIComponent(name), {
        method: 'DELETE',
        headers: { Authorization: 'Bearer ' + getToken() },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Delete failed');
      loadIcons();
    } catch (e) {
      alert(e.message);
    }
  }

  async function loadIcons() {
    const msg = document.getElementById('listMsg');
    const body = document.getElementById('iconTableBody');
    msg.className = 'msg';
    try {
      const res = await fetch('/api/icons');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to load icons');
      const icons = data.icons || [];
      if (icons.length === 0) {
        body.innerHTML = '<tr><td colspan="4" style="color:var(--muted)">No icons uploaded yet.</td></tr>';
        return;
      }
      body.innerHTML = icons.map(icon => `
        <tr>
          <td><span class="myicon myicon-${icon.name} icon-preview"></span></td>
          <td>${icon.name}</td>
          <td>${icon.category}</td>
          <td><button class="del-btn" onclick="deleteIcon('${icon.name}')">Delete</button></td>
        </tr>
      `).join('');
      if (window.GlyphCraft) window.GlyphCraft.reload();
    } catch (e) {
      msg.className = 'msg error';
      msg.textContent = e.message;
    }
  }

  showView();
</script>
</body>
</html>
